<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrewCMS Documentation — Agent-Ready Content Operating System</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Open-source, database-agnostic Content Control Plane for Next.js and modern web applications. Immutable revisions, governed publishing, vector intelligence, and native Model Context Protocol (MCP).">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #9A7653;
      --heading-color: #1A1A1A;
      --sidebar-background: #FAF8F5;
      --sidebar-border-color: #EAE6DF;
      --sidebar-name-color: #9A7653;
      --sidebar-nav-link-color: #4A4A4A;
      --sidebar-nav-link-color--active: #9A7653;
      --link-color: #9A7653;
      --code-inline-background: #F4EFEA;
      --code-inline-color: #7A5633;
    }
    .app-name-link {
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.25rem;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .markdown-section pre {
      border: 1px solid #EAE6DF;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app">Loading BrewCMS Documentation...</div>
  <script>
    window.$docsify = {
      name: 'BrewCMS',
      repo: 'https://github.com/victorkuldeep/brew-cms',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'index.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
